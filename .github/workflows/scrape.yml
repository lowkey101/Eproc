name: Daily JDA Tender Scraper

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install playwright playwright-stealth pandas
        playwright install chromium

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "TenderBot"
        git config --global user.email "bot@yourdomain.com"
        git add Tenders/
        git commit -m "Automated update: JDA Tenders $(date)" || exit 0
        git push
